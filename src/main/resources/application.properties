# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Spring Application Name & Active Profile
spring.application.name=leadcrm
spring.profiles.active=dev

# Default Datasource: H2 In-Memory
spring.datasource.url=jdbc:h2:mem:leadcrmdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Email Configuration (Mock / Testing)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=notifications@leadcrm.com
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Swagger OpenAPI UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Lead Scoring Custom Rules
app.lead.scoring.qr-scan-points=5
app.lead.scoring.website-visit-points=5
app.lead.scoring.whatsapp-click-points=10
app.lead.scoring.call-click-points=10
app.lead.scoring.enquiry-points=20
app.lead.scoring.proposal-request-points=30
app.lead.scoring.meeting-points=40

# Overdue Alert Scheduler Configuration (Runs every 5 minutes)
app.alerts.overdue-cron=0 */5 * * * *


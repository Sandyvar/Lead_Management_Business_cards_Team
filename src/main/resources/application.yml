server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: leadcrm
  profiles:
    active: dev

  # Default datasource: H2 In-Memory (Allows out-of-the-box local execution)
  datasource:
    url: jdbc:h2:mem:leadcrmdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Email Configuration (Dummy / Mock parameters for local testing)
  mail:
    host: smtp.gmail.com
    port: 587
    username: notifications@leadcrm.com
    password: password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Swagger OpenAPI UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Application specific settings
app:
  lead:
    scoring:
      qr-scan-points: 5
      website-visit-points: 5
      whatsapp-click-points: 10
      call-click-points: 10
      enquiry-points: 20
      proposal-request-points: 30
      meeting-points: 40
